name: CI

# Runs the same checks as the Workers Builds deploy (npm test) on every pull
# request, so a broken change is caught before it is merged and deployed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: cp .env.example .env.local
      - name: Typecheck
        run: npm run typecheck
      - name: Build and test
        run: npm test
